name: CD

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # go-sqlite3 needs CGO, so each target is built with a native C toolchain on
  # a runner of the matching OS and architecture. Linux binaries are built fully
  # static with musl in the Dockerfile's Alpine builder (no glibc; images pinned
  # by Alpine release and Go minor version, packages by version); windows/arm64
  # uses a pinned llvm-mingw toolchain.
  # Third-party actions and downloads are pinned by commit SHA or SHA-256.
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { goos: linux, goarch: amd64, runner: ubuntu-latest, smoke: true }
          - { goos: linux, goarch: arm64, runner: ubuntu-24.04-arm, smoke: true }
          - { goos: darwin, goarch: arm64, runner: macos-latest, smoke: true }
          # Intel runner, supported until the macOS 15 image is retired (Fall 2027).
          - { goos: darwin, goarch: amd64, runner: macos-15-intel, smoke: true }
          - { goos: windows, goarch: amd64, runner: windows-latest, smoke: true }
          - { goos: windows, goarch: arm64, runner: windows-11-arm, smoke: true }

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Linux builds use Go from the Dockerfile's builder image instead.
      - name: Set up Go
        if: matrix.goos != 'linux'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Latest Go 1.26 patch release (security fixes). No cache: release
          # binaries are built from clean module and build caches (SEC-018).
          go-version: "1.26.x"
          check-latest: true
          cache: false

      # The windows-11-arm image has no C compiler targeting aarch64-w64-mingw32,
      # which cgo needs; install a pinned, checksum-verified llvm-mingw.
      - name: Install llvm-mingw (windows/arm64)
        if: matrix.goos == 'windows' && matrix.goarch == 'arm64'
        shell: pwsh
        env:
          LLVM_MINGW_VERSION: "20260908"
          LLVM_MINGW_SHA256: "7fe35f60407473c420ac72b25137f54385b0affd2c42efd507c0062fc626ab56"
        run: |
          $name = "llvm-mingw-$env:LLVM_MINGW_VERSION-ucrt-aarch64"
          $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
          Invoke-WebRequest -Uri "https://github.com/mstorsjo/llvm-mingw/releases/download/$env:LLVM_MINGW_VERSION/$name.zip" -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLowerInvariant()
          if ($hash -ne $env:LLVM_MINGW_SHA256) { throw "llvm-mingw checksum mismatch: $hash" }
          # Windows' bundled bsdtar reads zip files; Git's GNU tar (possibly first on PATH) cannot.
          & "$env:SystemRoot\System32\tar.exe" -xf $zip -C $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw "extracting llvm-mingw failed with exit code $LASTEXITCODE" }
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:RUNNER_TEMP "$name\bin")
          Add-Content -Path $env:GITHUB_ENV -Value "CC=aarch64-w64-mingw32-clang"

      - name: Set release metadata
        id: meta
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # The image job derives the image tags from the release tag, so an
            # unusable tag fails here, before the release job creates a
            # release for it.
            if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "tag ${GITHUB_REF_NAME} is not vMAJOR.MINOR.PATCH[-PRERELEASE]" >&2
              exit 1
            fi
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            # manual run fallback
            echo "tag=manual-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build binary
        id: build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          VERSION: ${{ steps.meta.outputs.tag }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9A-Za-z._+-]+$ ]]; then
            echo "unexpected version string: $VERSION" >&2
            exit 1
          fi
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          out="dist/munus_${GOOS}_${GOARCH}${ext}"
          mkdir -p dist
          if [ "$GOOS" = "linux" ]; then
            # Fully static musl binary from the Dockerfile's "static" stage,
            # built natively for the runner's architecture (P-047).
            docker build --pull --target static --build-arg "VERSION=${VERSION}" \
              --output "type=local,dest=dist/static" .
            mv dist/static/munus "$out"
            rmdir dist/static
          else
            go build -ldflags="-s -w -X main.version=${VERSION}" -o "$out" .
          fi
          echo "binary=$out" >> "$GITHUB_OUTPUT"

      - name: Smoke test binary
        if: matrix.smoke
        shell: bash
        env:
          MUNUS_DB_PATH: ${{ runner.temp }}/smoke.db
        run: |
          bin="./${{ steps.build.outputs.binary }}"
          "$bin" --version
          "$bin" add --title "smoke" --description "release smoke test"
          # Not grep -q: with pipefail, munus could fail with SIGPIPE if grep
          # exits before munus has written all of its output.
          "$bin" list | grep "smoke" > /dev/null
          if [ "${{ matrix.goos }}" = "linux" ]; then
            # Static (no program interpreter) with an 8 MiB thread stack
            # request; it must also run on an older glibc distribution and on
            # musl-based Alpine.
            file "$bin" | grep "statically linked" > /dev/null
            headers="$(readelf -lW "$bin")"
            if grep -q INTERP <<< "$headers"; then
              echo "binary has a program interpreter" >&2
              exit 1
            fi
            grep GNU_STACK <<< "$headers" | grep 0x800000 > /dev/null
            name="$(basename "$bin")"
            for image in debian:11 alpine:3.24; do
              docker run --rm -v "$PWD/dist:/dist:ro" -e MUNUS_DB_PATH=/tmp/smoke.db "$image" \
                sh -c "/dist/$name add --title smoke --description 'release smoke test' && /dist/$name list | grep -q smoke"
            done
          fi

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ steps.build.outputs.binary }}
          if-no-files-found: error

      # The image for GitHub Packages is built on the same native Linux runners
      # (go-sqlite3 needs CGO) and handed to the publishing job as an artifact,
      # so no job that builds or runs code can write packages. BuildKit's own
      # provenance is off; the image-attest job attests the pushed image.
      - name: Build container image
        if: matrix.goos == 'linux'
        shell: bash
        env:
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ steps.meta.outputs.tag }}
        run: |
          docker build --pull --provenance=false --build-arg "VERSION=${VERSION}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --tag "munus:release-${GOARCH}" .

      - name: Smoke test container image
        if: matrix.goos == 'linux'
        shell: bash
        env:
          IMAGE: munus:release-${{ matrix.goarch }}
          VERSION: ${{ steps.meta.outputs.tag }}
        run: |
          test "$(docker run --rm "$IMAGE" --version)" = "munus version ${VERSION}"
          docker volume create munus-release-smoke > /dev/null
          docker run --rm -v munus-release-smoke:/app/data "$IMAGE" add --title smoke --description "release image smoke test"
          docker run --rm -v munus-release-smoke:/app/data "$IMAGE" list | grep smoke > /dev/null
          for file in LICENSE NOTICE THIRD_PARTY_LICENSES; do
            docker run --rm --entrypoint cat "$IMAGE" "/usr/share/licenses/munus/$file" | cmp - "$file"
          done

      - name: Save container image
        if: matrix.goos == 'linux'
        shell: bash
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p image
          docker save --output "image/munus_linux_${GOARCH}.tar" "munus:release-${GOARCH}"

      - name: Upload container image
        if: matrix.goos == 'linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-linux-${{ matrix.goarch }}
          path: image/munus_linux_${{ matrix.goarch }}.tar
          if-no-files-found: error

  # Packaging and attestation run without write access to the repository; only
  # the publishing jobs below (release, image) can write, and they cannot mint
  # OIDC tokens.
  package:
    name: Package and attest
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Build provenance attestations (Sigstore certificate via OIDC).
      id-token: write
      attestations: write

    steps:
      # LICENSE, NOTICE and THIRD_PARTY_LICENSES go into every archive.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bin-*
          merge-multiple: true
          path: dist

      - name: Package release artifacts
        shell: bash
        run: |
          cd dist
          licenses=(LICENSE NOTICE THIRD_PARTY_LICENSES)
          for bin in munus_*; do
            name="${bin%.exe}"
            chmod +x "$bin"
            if [ "$bin" != "$name" ]; then
              zip -q -j "${name}.zip" "$bin" "${licenses[@]/#/../}"
              listing="$(unzip -Z1 "${name}.zip")"
            else
              tar -czf "${name}.tar.gz" "$bin" -C .. "${licenses[@]}"
              listing="$(tar -tzf "${name}.tar.gz")"
            fi
            for file in "$bin" "${licenses[@]}"; do
              grep -qx "$file" <<< "$listing" || { echo "$file missing from $name" >&2; exit 1; }
            done
            rm "$bin"
          done
          ls -l

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum -- * > checksums.txt

      # Verify with: gh attestation verify <archive> --repo jabbott-iii/Munus
      - name: Attest build provenance
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

      - name: Upload release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          if-no-files-found: error

  release:
    name: Release
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  # Publishes the tested images to GitHub Packages (ghcr.io) as one
  # multi-platform image. Only this job can write packages; it checks out and
  # builds nothing, and it cannot mint OIDC tokens.
  image:
    name: Publish container image
    needs: release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    outputs:
      name: ${{ steps.push.outputs.name }}
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Download container images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-linux-*
          merge-multiple: true
          path: image

      - name: Log in to GitHub Container Registry
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$REGISTRY_TOKEN"

      # Image tags drop the release tag's "v": X.Y.Z (multi-platform; the digest
      # image-attest attests) and X.Y.Z-amd64 / X.Y.Z-arm64 (one platform each).
      # Stable releases (vX.Y.Z) also move X.Y and latest to this image;
      # pre-releases (vX.Y.Z-rc.1) do not. Both images are checked before
      # anything is pushed.
      - name: Push image
        id: push
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          # The build job already rejected other tags.
          if [[ ! "$VERSION" =~ ^v([0-9]+\.[0-9]+)\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "tag $VERSION is not vMAJOR.MINOR.PATCH[-PRERELEASE]; image tags cannot be derived from it" >&2
            exit 1
          fi
          version="${VERSION#v}"
          tags=(--tag "${image}:${version}")
          if [ -z "${BASH_REMATCH[2]}" ]; then
            tags+=(--tag "${image}:${BASH_REMATCH[1]}" --tag "${image}:latest")
          fi
          digest_of() {
            local digest
            digest="$(docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -r .digest)"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "unexpected digest for $1: $digest" >&2
              return 1
            fi
            echo "$digest"
          }
          for arch in amd64 arm64; do
            docker load --input "image/munus_linux_${arch}.tar"
            platform="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "munus:release-${arch}")"
            if [ "$platform" != "linux/${arch}" ]; then
              echo "munus:release-${arch} is built for ${platform}" >&2
              exit 1
            fi
          done
          sources=()
          for arch in amd64 arm64; do
            docker tag "munus:release-${arch}" "${image}:${version}-${arch}"
            docker push "${image}:${version}-${arch}"
            digest="$(digest_of "${image}:${version}-${arch}")"
            sources+=("${image}@${digest}")
          done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          digest="$(digest_of "${image}:${version}")"
          echo "name=${image}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

  # Attests the published image. This job can mint OIDC tokens but cannot
  # write packages or contents; the attestation is stored with GitHub, not in
  # the registry.
  image-attest:
    name: Attest container image
    needs: image
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      # Verify with: gh attestation verify oci://ghcr.io/jabbott-iii/munus:X.Y.Z --repo jabbott-iii/Munus
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ needs.image.outputs.name }}
          subject-digest: ${{ needs.image.outputs.digest }}
