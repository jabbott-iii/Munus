name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Comprehensive CI testing
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Verify dependencies
        run: go mod tidy && git diff --exit-code
        shell: bash

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.13.2

      - name: Run tests with coverage
        shell: bash
        run: go test -v -coverprofile=coverage.out './...'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.out

      - name: Build multi-platform binaries
        shell: bash
        run: |
          GOOS=linux GOARCH=amd64 go build -o cryptare-linux-amd64
          GOOS=darwin GOARCH=amd64 go build -o cryptare-darwin-amd64
          GOOS=windows GOARCH=amd64 go build -o cryptare-windows-amd64.exe
