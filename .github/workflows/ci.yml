name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Comprehensive CI testing
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Verify dependencies
        run: go mod tidy && git diff --exit-code
        shell: bash

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

      - name: Run tests with coverage
        shell: bash
        run: go test -v -coverprofile=coverage.out './...'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: ./coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      # go-sqlite3 needs CGO, so build natively on each OS and run the binary to
      # prove it can open a database (a CGO-less build compiles but cannot).
      - name: Build and smoke-test native binary
        shell: bash
        env:
          CGO_ENABLED: "1"
          EXT: ${{ runner.os == 'Windows' && '.exe' || '' }}
          MUNUS_DB_PATH: ${{ runner.temp }}/ci-smoke.db
        run: |
          go build -o "munus-ci${EXT}" .
          "./munus-ci${EXT}" --version
          "./munus-ci${EXT}" add --title "smoke" --description "CI smoke test"
          "./munus-ci${EXT}" list | grep -q "smoke"
